<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Suara Latar Pop Art 🌊🎧</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <header class="player-header">
            <h1>🎧 AMBIENT PLAYER</h1>
            <p>Putar suara alam rileks di bawah ini untuk membantumu tetap fokus saat belajar atau koding!</p>
        </header>

        <main class="sound-deck">
            
            <div class="sound-card" data-audio-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
                <div class="card-info">
                    <span class="sound-icon">🌧️</span>
                    <div class="sound-details">
                        <h3>Hujan Rintik</h3>
                        <p>Fokus & Tenang</p>
                    </div>
                </div>
                <button class="btn-play-state">PUTAR ⏸️</button>
            </div>

            <div class="sound-card" data-audio-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
                <div class="card-info">
                    <span class="sound-icon">🌊</span>
                    <div class="sound-details">
                        <h3>Deburan Ombak</h3>
                        <p>Santai & Rileks</p>
                    </div>
                </div>
                <button class="btn-play-state">PUTAR ⏸️</button>
            </div>

            <div class="sound-card" data-audio-url="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
                <div class="card-info">
                    <span class="sound-icon">🌲</span>
                    <div class="sound-details">
                        <h3>Angin Hutan</h3>
                        <p>Inspirasi & Ide</p>
                    </div>
                </div>
                <button class="btn-play-state">PUTAR ⏸️</button>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
